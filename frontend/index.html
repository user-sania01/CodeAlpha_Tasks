
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Language Translation Tool</h1>

        <p class="subtitle">
            Translate text from one language to another
        </p>

        <div class="translator-box">

            <!-- Source Language -->

            <div class="language-box">

                <label for="sourceLanguage">
                    Translate From
                </label>

                <select id="sourceLanguage">

    <option value="auto">
        Auto Detect
    </option>

    <option value="en">
        English
    </option>

    <option value="hi">
        Hindi
    </option>

    <option value="gu">
        Gujarati
    </option>

    <option value="mr">
        Marathi
    </option>

    <option value="fr">
        French
    </option>

    <option value="es">
        Spanish
    </option>

    <option value="de">
        German
    </option>

</select>

            </div>


            <!-- Input Text -->

            <div class="text-area-box">

                <textarea
                    id="inputText"
                    placeholder="Enter text here..."
                    maxlength="5000">
                </textarea>

                <span id="characterCount">
                    0 / 5000
                </span>

            </div>


            <!-- Target Language -->

            <div class="language-box">

                <label for="targetLanguage">
                    Translate To
                </label>

                <select id="targetLanguage">

    <option value="hi">
        Hindi
    </option>

    <option value="en">
        English
    </option>

    <option value="gu">
        Gujarati
    </option>

    <option value="mr">
        Marathi
    </option>

    <option value="fr">
        French
    </option>

    <option value="es">
        Spanish
    </option>

    <option value="de">
        German
    </option>

</select>

            </div>


            <!-- Translate Button -->

            <button id="translateButton">
                Translate
            </button>


            <!-- Result -->

            <div class="result-box">

                <h2>Translation</h2>

                <div id="translationResult">
                    Your translated text will appear here.
                </div>

            </div>


            <!-- Action Buttons -->

            <div class="action-buttons">

                <button id="copyButton">
                    📋 Copy
                </button>

                <button id="speakButton">
                    🔊 Speak
                </button>

                <button id="clearButton">
                    🗑 Clear
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
